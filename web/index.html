<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heat Simulation Visualizer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-wrapper">
        <header class="main-header">
            <h1>Heat Simulation Visualizer</h1>
            <p>Configure boundary temperatures and visualize the heat spread in real-time.</p>
        </header>

        <nav class="nav-tabs">
            <button class="tab-btn active" data-tab="sim-tab">Simulation</button>
            <button class="tab-btn" data-tab="history-tab">History</button>
        </nav>

        <main class="dashboard-container">
            <div class="main-layout" id="sim-tab">
                <section class="panel controls-panel">
                    <h2 class="panel-title">Simulation Parameters</h2>
                    
                    <div class="input-group">
                        <label for="simMode">Simulation Mode</label>
                        <select id="simMode" class="mode-select">
                            <option value="fdm">Initial Conditions (FDM)</option>
                            <option value="pde">PDE-driven (Analytical)</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="rows">Grid Resolution</label>
                        <div class="row-input">
                            <input type="number" id="rows" value="20" placeholder="Rows">
                            <span class="separator">×</span>
                            <input type="number" id="cols" value="20" placeholder="Cols">
                        </div>
                    </div>

                    <div id="pde-params" class="input-group hidden">
                        <label for="alpha">Thermal Diffusivity (α)</label>
                        <input type="number" id="alpha" value="0.01" step="0.001">
                    </div>

                    <div class="input-group">
                        <label>Boundary Temperatures (°C)</label>
                        <div class="temp-grid">
                            <div class="temp-field">
                                <label for="top">Top</label>
                                <input type="number" id="top" value="100">
                            </div>
                            <div class="temp-field">
                                <label for="bottom">Bottom</label>
                                <input type="number" id="bottom" value="0">
                            </div>
                            <div class="temp-field">
                                <label for="left">Left</label>
                                <input type="number" id="left" value="0">
                            </div>
                            <div class="temp-field">
                                <label for="right">Right</label>
                                <input type="number" id="right" value="0">
                            </div>
                        </div>
                    </div>

                    <div id="time-evolution-ctrl" class="input-group hidden">
                        <label for="timeSlider">Time Evolution (Step: <span id="timeVal">0</span>)</label>
                        <input type="range" id="timeSlider" min="0" max="1000" value="0" class="slider">
                    </div>

                    <button id="runBtn" class="primary-btn">Run Simulation</button>
                    <div id="status" class="status-display">Ready to simulate</div>
                </section>

                <section class="panel visualization-panel">
                    <div class="canvas-stage">
                        <canvas id="heatCanvas"></canvas>
                    </div>
                    <div class="legend-container">
                        <div class="legend-label">0°C</div>
                        <div class="gradient-bar"></div>
                        <div class="legend-label">100°C</div>
                    </div>
                </section>
            </div>

            <div class="main-layout hidden" id="history-tab">
                <section class="panel history-panel">
                    <h2 class="panel-title">Simulation History</h2>
                    <div class="table-responsive">
                        <table id="historyTable">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Resolution</th>
                                    <th>Boundaries (T/B/L/R)</th>
                                    <th>Steps</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <button id="clearHistoryBtn" class="secondary-btn">Clear History</button>
                </section>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
